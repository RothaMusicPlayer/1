services:
  - type: web
    name: coffee-pos-cloud
    runtime: docker
    plan: starter
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: coffee-pos-data
      mountPath: /var/data
      sizeGB: 1
