<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EMinor Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-paper: #FAF6F0;
      --card-surface: #FFFDF9;
      --border-hairline: rgba(44, 30, 22, 0.14);
      --border-strong: rgba(44, 30, 22, 0.28);
      --text-primary: #231812;
      --text-secondary: #58463B;
      --text-muted: #8A7668;
      --accent-espresso: #331F14;
      --accent-caramel: #B87235;
      --accent-hot: #B93820;
      --accent-ice: #18648B;
      --accent-success: #1D7A43;
      --blush-banner: #F0DCD4;
      --shadow-sheet: 0 12px 34px rgba(35, 24, 18, 0.08);
      --shadow-float: 0 14px 32px rgba(24, 14, 8, 0.22);
      --nav-height: 76px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Kantumruy Pro', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #EFE8DE;
      background-image:
        radial-gradient(at 15% 10%, rgba(212, 163, 115, 0.14) 0px, transparent 50%),
        radial-gradient(at 85% 90%, rgba(168, 124, 92, 0.12) 0px, transparent 50%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
    }

    button, input, select, textarea {
      touch-action: manipulation;
    }

    .app-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 14px calc(var(--nav-height) + 40px);
    }

    .ui-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Top Control Bar */
    .top-header {
      position: sticky;
      top: 8px;
      z-index: 30;
      background: rgba(250, 246, 240, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-hairline);
      border-radius: 20px;
      padding: 10px 14px;
      box-shadow: 0 6px 20px rgba(35, 24, 18, 0.06);
      margin-bottom: 14px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--accent-espresso);
      color: #FAF6F0;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-mini-title {
      font-family: 'Cormorant Garamond', 'Kantumruy Pro', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      border: 1px solid var(--border-hairline);
      background: #FFFFFF;
      color: var(--text-primary);
      border-radius: 12px;
      padding: 8px 12px;
      min-height: 38px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform 0.14s ease, background 0.16s ease;
      white-space: nowrap;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .lang-toggle-btn {
      background: var(--blush-banner);
      border-color: rgba(44, 30, 22, 0.18);
      color: var(--text-primary);
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(460px, calc(100% - 28px));
      height: 60px;
      background: rgba(250, 246, 240, 0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      box-shadow: var(--shadow-float);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 5px;
      z-index: 40;
    }

    .nav-item {
      border: none;
      background: transparent;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .nav-item.active {
      background: var(--accent-espresso);
      color: #FAF6F0;
    }

    /* Modal / Bottom Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 12, 7, 0.52);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    @media (min-width: 700px) {
      .modal-backdrop {
        align-items: center;
      }
    }

    .modal-sheet {
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--bg-paper);
      border: 1px solid var(--border-strong);
      border-radius: 26px;
      padding: 20px;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.32);
      animation: slideUp 0.2s ease-out;
      position: relative;
    }

    .drag-handle {
      width: 40px;
      height: 5px;
      border-radius: 999px;
      background: rgba(60, 40, 28, 0.22);
      margin: -4px auto 12px;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .close-modal-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-hairline);
      background: #FFFFFF;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .mode-switch-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #EAE2D6;
      padding: 4px;
      border-radius: 14px;
      margin-top: 12px;
    }

    .mode-option-btn {
      border: none;
      background: transparent;
      border-radius: 10px;
      padding: 9px 12px;
      min-height: 40px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .mode-option-btn.active[data-mode="hot"] {
      background: var(--accent-hot);
      color: #FFFFFF;
    }

    .mode-option-btn.active[data-mode="ice"] {
      background: var(--accent-ice);
      color: #FFFFFF;
    }

    .mode-option-btn.disabled-mode {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .drink-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2.5px 9px;
      border-radius: 999px;
    }

    .drink-tag.temp-hot {
      background: rgba(185, 56, 32, 0.14);
      color: var(--accent-hot);
    }

    .drink-tag.temp-ice {
      background: rgba(24, 100, 139, 0.14);
      color: var(--accent-ice);
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #FFFFFF;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border-hairline);
      margin: 12px 0;
    }

    .seg-group {
      display: inline-flex;
      background: #EAE2D6;
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      padding: 6px 11px;
      min-height: 34px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .seg-btn.active {
      background: #FFFFFF;
      color: var(--text-primary);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }

    .section-heading {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent-espresso);
      margin: 16px 0 8px;
    }

    .ingredients-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ing-item {
      background: #FFFFFF;
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .ing-item.checked {
      opacity: 0.55;
      text-decoration: line-through;
    }

    .ing-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ing-check {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-espresso);
    }

    .ing-amount {
      font-weight: 700;
      color: var(--accent-caramel);
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .steps-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .tip-box {
      margin-top: 14px;
      background: var(--blush-banner);
      border-left: 4px solid var(--accent-caramel);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      color: var(--text-primary);
    }

    .modal-footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .modal-footer-actions:empty,
    #deleteCustomBtn[style*="display: none"] {
      display: none !important;
    }

    .guide-cup-visual {
      width: 86px;
      height: 94px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      position: relative;
      background: transparent;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(35, 24, 18, 0.92);
      color: #FFFFFF;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 90;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-container" id="appContainer">
    <!-- Top Header Controls -->
    <header class="top-header">
      <div class="header-top-row">
        <div class="brand-mini">
          <div class="brand-badge" aria-hidden="true">
            <svg class="ui-icon" viewBox="0 0 24 24">
              <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
              <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
              <line x1="6" y1="2" x2="6" y2="4"></line>
              <line x1="10" y1="2" x2="10" y2="4"></line>
              <line x1="14" y1="2" x2="14" y2="4"></line>
            </svg>
          </div>
          <span class="brand-mini-title" id="mainHeaderTitle">EMinor Menu</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn lang-toggle-btn" id="langToggleBtn" title="ប្តូរភាសា / Switch Language">
            <svg class="ui-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <span id="langBadgeText">EN</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Area (Calculator results removed) -->
    <main id="mainContent"></main>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="ម៉ឺនុយរុករក">
    <button class="nav-item" id="navAll" data-tab="all">
      <svg class="ui-icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      <span id="navAllLabel">ម៉ឺនុយ (0)</span>
    </button>
    <button class="nav-item" id="navFav" data-tab="fav">
      <svg class="ui-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      <span id="navFavLabel">ចូលចិត្ត</span>
    </button>
    <button class="nav-item active" id="navCalc" data-tab="calc">
      <svg class="ui-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="10" y2="10"></line><line x1="14" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="10" y2="14"></line><line x1="14" y1="14" x2="16" y2="14"></line><line x1="8" y1="18" x2="16" y2="18"></line></svg>
      <span id="navCalcLabel">គណនារង្វាស់</span>
    </button>
  </nav>

  <!-- Recipe Detail Modal -->
  <div class="modal-backdrop" id="recipeModal" role="dialog" aria-modal="true">
    <div class="modal-sheet" id="recipeSheet">
      <div class="drag-handle"></div>
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 14px;">
          <div id="modalArtBox" class="guide-cup-visual"></div>
          <div>
            <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
              <span class="drink-tag" id="modalTempTag"></span>
            </div>
            <h2 id="modalTitleMain" style="margin: 4px 0 2px; font-size: 1.25rem; text-transform: uppercase;"></h2>
          </div>
        </div>
        <button class="close-modal-btn" id="closeRecipeModal" aria-label="បិទ">X</button>
      </div>

      <!-- Hot / Ice Mode Switcher -->
      <div class="mode-switch-bar" id="modalModeSwitchBar" role="group" aria-label="ជ្រើសរើសក្តៅ ឬ ត្រជាក់">
        <button type="button" class="mode-option-btn" data-mode="hot" id="modeHotBtn">ក្តៅ (Hot)</button>
        <button type="button" class="mode-option-btn" data-mode="ice" id="modeIceBtn">ត្រជាក់ (Ice)</button>
      </div>

      <p id="modalDesc" style="margin: 12px 0 0; font-size: 0.88rem; color: var(--text-secondary); line-height: 1.5;"></p>

      <!-- Cup Size & Batch Multiplier -->
      <div class="controls-bar">
        <div>
          <div id="cupSizeLabel" style="font-size: 0.72rem; color: var(--text-muted); font-weight: 700; margin-bottom: 3px;">ទំហំកែវ (Cup Size)</div>
          <div class="seg-group" id="cupSizeGroup">
            <button class="seg-btn" data-size="12oz">12oz</button>
            <button class="seg-btn active" data-size="16oz">16oz</button>
            <button class="seg-btn" data-size="22oz">22oz</button>
          </div>
        </div>
        <div>
          <div id="batchLabel" style="font-size: 0.72rem; color: var(--text-muted); font-weight: 700; margin-bottom: 3px;">ចំនួនកែវធ្វើ (Batch)</div>
          <div class="seg-group" id="batchGroup">
            <button class="seg-btn active" data-batch="1">1x</button>
            <button class="seg-btn" data-batch="2">2x</button>
            <button class="seg-btn" data-batch="3">3x</button>
            <button class="seg-btn" data-batch="5">5x</button>
          </div>
        </div>
      </div>

      <div class="section-heading" id="ingSectionHeading">គ្រឿងផ្សំ និងរង្វាស់ស្តង់ដារ (ចុចដើម្បីធីក)</div>
      <ul class="ingredients-list" id="modalIngredients"></ul>

      <div class="section-heading" id="stepsSectionHeading">របៀបធ្វើតាមជំហាន</div>
      <ol class="steps-list" id="modalSteps"></ol>

      <div class="tip-box" id="modalTip"></div>

      <div class="modal-footer-actions" id="modalFooterActions">
        <button class="icon-btn" id="deleteCustomBtn" style="display:none; color:#B81D37;">លុបមុខនេះ</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const UI_STRINGS = {
      km: {
        docTitle: "EMinor Menu",
        headerTitle: "EMinor Menu",
        langBadge: "EN",
        hotFull: "ក្តៅ (Hot)",
        iceFull: "ត្រជាក់ (Ice)",
        navMenu: (n) => `ម៉ឺនុយ (${n})`,
        navFav: "ចូលចិត្ត",
        navCalc: "គណនារង្វាស់",
        cupSizeLabel: "ទំហំកែវ (Cup Size)",
        batchLabel: "ចំនួនកែវធ្វើ (Batch)",
        ingHeading: "គ្រឿងផ្សំ និងរង្វាស់ស្តង់ដារ (ចុចដើម្បីធីក)",
        stepsHeading: "របៀបធ្វើតាមជំហាន",
        tipPrefix: "គន្លឹះធ្វើ៖",
        defaultTip: "វាស់គ្រឿងផ្សំឱ្យច្បាស់លាស់ ដើម្បីរក្សារសជាតិថេរ។",
        deleteCustomBtn: "លុបមុខនេះ",
        toastDeletedRecipe: "បានលុបមុខចេញពីម៉ឺនុយ",
        toastLangSwitched: "បានប្តូរទៅភាសាខ្មែរ"
      },
      en: {
        docTitle: "EMinor Menu",
        headerTitle: "EMinor Menu",
        langBadge: "ខ្មែរ",
        hotFull: "Hot",
        iceFull: "Ice",
        navMenu: (n) => `Menu (${n})`,
        navFav: "Favorites",
        navCalc: "Yield Calc",
        cupSizeLabel: "Cup Size",
        batchLabel: "Batch Multiplier",
        ingHeading: "Ingredients & Standard Measurements (Tap to check)",
        stepsHeading: "Step-by-Step Instructions",
        tipPrefix: "Prep Tip:",
        defaultTip: "Measure ingredients accurately for consistent flavor every time.",
        deleteCustomBtn: "Delete Item",
        toastDeletedRecipe: "Item removed from menu",
        toastLangSwitched: "Switched to English"
      }
    };

    const STORAGE_KEYS = {
      CUSTOM_RECIPES: "eminor_menu_custom_clean_v1",
      FAVORITES: "eminor_menu_fav_clean_v1",
      LANG: "eminor_menu_lang_v1"
    };

    let customRecipes = loadJson(STORAGE_KEYS.CUSTOM_RECIPES, []);
    let favorites = new Set(loadJson(STORAGE_KEYS.FAVORITES, []));

    let state = {
      lang: loadJson(STORAGE_KEYS.LANG, "km") === "en" ? "en" : "km",
      tab: "calc",
      activeRecipeId: null,
      activeMode: "hot",
      cupSize: "16oz",
      batch: 1
    };

    const CUP_SIZE_MULTIPLIER = {
      "12oz": 0.8,
      "16oz": 1.0,
      "22oz": 1.3
    };

    function t() {
      return UI_STRINGS[state.lang] || UI_STRINGS.km;
    }

    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function getAllRecipes() {
      return [...customRecipes];
    }

    function supportsTemp(recipe, temp) {
      return Boolean(recipe && recipe.variants && recipe.variants[temp]);
    }

    function getDefaultVariantKey(recipe) {
      if (supportsTemp(recipe, "hot")) return "hot";
      return "ice";
    }

    function getActiveVariant(recipe, mode = state.activeMode) {
      if (!recipe || !recipe.variants) return null;
      return recipe.variants[mode] || recipe.variants.hot || recipe.variants.ice;
    }

    function getRecipeDisplayTitle(r) {
      if (state.lang === "en") {
        return r.nameEn || r.nameKm;
      }
      return r.nameEn ? `${r.nameKm} (${r.nameEn})` : r.nameKm;
    }

    function getRecipeSteps(variant) {
      if (!variant) return [];
      if (state.lang === "en" && Array.isArray(variant.stepsEn) && variant.stepsEn.length) return variant.stepsEn;
      if (Array.isArray(variant.stepsKm) && variant.stepsKm.length) return variant.stepsKm;
      return variant.steps || [];
    }

    function getRecipeTip(variant) {
      if (!variant) return t().defaultTip;
      return state.lang === "en" ? (variant.tipEn || variant.tipKm || t().defaultTip) : (variant.tipKm || variant.tipEn || t().defaultTip);
    }

    function getIngredientName(ing) {
      return state.lang === "en" ? (ing.nameEn || ing.nameKm || ing.name || "") : (ing.nameKm || ing.nameEn || ing.name || "");
    }

    function applyStaticTranslations() {
      const s = t();
      document.documentElement.lang = state.lang;
      document.title = s.docTitle;
      document.getElementById("mainHeaderTitle").textContent = s.headerTitle;
      document.getElementById("langBadgeText").textContent = s.langBadge;
      document.getElementById("navAllLabel").textContent = s.navMenu(getAllRecipes().length);
      document.getElementById("navFavLabel").textContent = s.navFav;
      document.getElementById("navCalcLabel").textContent = s.navCalc;

      document.getElementById("modeHotBtn").textContent = s.hotFull;
      document.getElementById("modeIceBtn").textContent = s.iceFull;

      document.getElementById("cupSizeLabel").textContent = s.cupSizeLabel;
      document.getElementById("batchLabel").textContent = s.batchLabel;
      document.getElementById("ingSectionHeading").textContent = s.ingHeading;
      document.getElementById("stepsSectionHeading").textContent = s.stepsHeading;
      document.getElementById("deleteCustomBtn").textContent = s.deleteCustomBtn;
    }

    function toggleLanguage() {
      state.lang = state.lang === "km" ? "en" : "km";
      saveJson(STORAGE_KEYS.LANG, state.lang);
      applyStaticTranslations();
      if (state.activeRecipeId && document.getElementById("recipeModal").classList.contains("open")) {
        openRecipeModal(state.activeRecipeId, state.activeMode);
      }
      showToast(t().toastLangSwitched);
    }

    function switchTab(tabName) {
      state.tab = tabName;
      document.querySelectorAll(".nav-item").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });
    }

    function formatScaledAmount(baseAmt, unit) {
      if (typeof baseAmt !== "number" || isNaN(baseAmt)) return "";
      const mult = CUP_SIZE_MULTIPLIER[state.cupSize] * state.batch;
      const val = baseAmt * mult;
      const rounded = val >= 50 ? Math.round(val) : Math.round(val * 10) / 10;
      return `${rounded} ${unit || ""}`.trim();
    }

    function openRecipeModal(id, preferredMode) {
      const recipe = getAllRecipes().find((r) => r.id === id);
      if (!recipe) return;

      state.activeRecipeId = id;
      const targetMode = supportsTemp(recipe, preferredMode) ? preferredMode : getDefaultVariantKey(recipe);
      state.activeMode = targetMode;
      state.cupSize = "16oz";
      state.batch = 1;

      document.querySelectorAll("#cupSizeGroup .seg-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.size === "16oz");
      });
      document.querySelectorAll("#batchGroup .seg-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.batch === "1");
      });

      const hotBtn = document.getElementById("modeHotBtn");
      const iceBtn = document.getElementById("modeIceBtn");
      const hasHot = supportsTemp(recipe, "hot");
      const hasIce = supportsTemp(recipe, "ice");

      hotBtn.disabled = !hasHot;
      hotBtn.classList.toggle("disabled-mode", !hasHot);
      iceBtn.disabled = !hasIce;
      iceBtn.classList.toggle("disabled-mode", !hasIce);

      document.getElementById("modalTitleMain").textContent = getRecipeDisplayTitle(recipe);
      document.getElementById("deleteCustomBtn").style.display = recipe.isCustom ? "inline-flex" : "none";

      renderModalVariantContent(recipe, targetMode);
      document.getElementById("recipeModal").classList.add("open");
    }

    function renderModalVariantContent(recipe, mode) {
      const s = t();
      const variant = getActiveVariant(recipe, mode);
      if (!variant) return;

      document.querySelectorAll("#modalModeSwitchBar .mode-option-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });

      const isHot = mode === "hot";
      document.getElementById("modalArtBox").innerHTML = "";

      const tempTag = document.getElementById("modalTempTag");
      tempTag.textContent = isHot ? s.hotFull : s.iceFull;
      tempTag.className = "drink-tag " + (isHot ? "temp-hot" : "temp-ice");

      document.getElementById("modalDesc").textContent = state.lang === "en"
        ? (variant.descEn || variant.descKm || "")
        : (variant.descKm || variant.descEn || "");
      document.getElementById("modalTip").innerHTML = `<strong>${escapeHtml(s.tipPrefix)}</strong> ${escapeHtml(getRecipeTip(variant))}`;

      const stepsOl = document.getElementById("modalSteps");
      stepsOl.innerHTML = getRecipeSteps(variant).map((st) => `<li>${escapeHtml(st)}</li>`).join("");

      renderModalIngredients(variant);
    }

    function renderModalIngredients(variant) {
      const ul = document.getElementById("modalIngredients");
      ul.innerHTML = (variant.ingredients || []).map((ing, idx) => {
        const ingName = getIngredientName(ing);
        const amtText = formatScaledAmount(ing.amount, ing.unit);
        return `
          <li class="ing-item" data-idx="${idx}">
            <div class="ing-left">
              <input type="checkbox" class="ing-check" aria-label="${escapeHtml(ingName)}" />
              <span>${escapeHtml(ingName)}</span>
            </div>
            <span class="ing-amount">${escapeHtml(amtText)}</span>
          </li>
        `;
      }).join("");

      ul.querySelectorAll(".ing-item").forEach((item) => {
        const cb = item.querySelector(".ing-check");
        item.addEventListener("click", (e) => {
          if (e.target !== cb) cb.checked = !cb.checked;
          item.classList.toggle("checked", cb.checked);
        });
        cb.addEventListener("change", () => {
          item.classList.toggle("checked", cb.checked);
        });
      });
    }

    function deleteActiveCustomRecipe() {
      const s = t();
      if (!state.activeRecipeId) return;
      customRecipes = customRecipes.filter((r) => r.id !== state.activeRecipeId);
      favorites.delete(state.activeRecipeId);
      saveJson(STORAGE_KEYS.CUSTOM_RECIPES, customRecipes);
      saveJson(STORAGE_KEYS.FAVORITES, [...favorites]);
      document.getElementById("recipeModal").classList.remove("open");
      applyStaticTranslations();
      showToast(s.toastDeletedRecipe);
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function initEvents() {
      document.getElementById("langToggleBtn").addEventListener("click", toggleLanguage);

      document.getElementById("navAll").addEventListener("click", () => switchTab("all"));
      document.getElementById("navFav").addEventListener("click", () => switchTab("fav"));
      document.getElementById("navCalc").addEventListener("click", () => switchTab("calc"));

      document.querySelectorAll("#modalModeSwitchBar .mode-option-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          const recipe = getAllRecipes().find((r) => r.id === state.activeRecipeId);
          if (!recipe || !supportsTemp(recipe, btn.dataset.mode)) return;
          state.activeMode = btn.dataset.mode;
          renderModalVariantContent(recipe, state.activeMode);
        });
      });

      document.querySelectorAll("#cupSizeGroup .seg-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.cupSize = btn.dataset.size;
          document.querySelectorAll("#cupSizeGroup .seg-btn").forEach((b) => b.classList.toggle("active", b === btn));
          const recipe = getAllRecipes().find((r) => r.id === state.activeRecipeId);
          const variant = getActiveVariant(recipe, state.activeMode);
          if (variant) renderModalIngredients(variant);
        });
      });

      document.querySelectorAll("#batchGroup .seg-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.batch = parseInt(btn.dataset.batch, 10) || 1;
          document.querySelectorAll("#batchGroup .seg-btn").forEach((b) => b.classList.toggle("active", b === btn));
          const recipe = getAllRecipes().find((r) => r.id === state.activeRecipeId);
          const variant = getActiveVariant(recipe, state.activeMode);
          if (variant) renderModalIngredients(variant);
        });
      });

      document.getElementById("closeRecipeModal").addEventListener("click", () => {
        document.getElementById("recipeModal").classList.remove("open");
      });
      document.getElementById("recipeModal").addEventListener("click", (e) => {
        if (e.target.id === "recipeModal") e.target.classList.remove("open");
      });

      document.getElementById("deleteCustomBtn").addEventListener("click", deleteActiveCustomRecipe);
    }

    applyStaticTranslations();
    initEvents();
  </script>
</body>
</html>
