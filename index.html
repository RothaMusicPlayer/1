<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QUO - Social & Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-main: #000;
            --bg-chat: #121212;
            --bg-header: #000;
            --text-primary: #ffffff;
            --text-secondary: #879099;
            --bg-hover: #1a1a1a;
            --telegram-blue: #3390ec;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            background: #000; 
            color: var(--text-primary); 
            height: 100vh; 
            height: 100dvh; 
            width: 100%;
            overflow: hidden; 
            display: flex; 
            position: fixed;
            inset: 0;
        }

        /* Custom Alert Modal */
        #customAlertModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 3500; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 20px; }
        .custom-alert-card { background: #181818; color: #fff; width: 100%; max-width: 320px; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #333; }
        .custom-alert-btn { width: 100%; padding: 12px; border-radius: 14px; background: var(--telegram-blue); color: white; border: none; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 15px; }

        /* App Layout */
        .app { display: flex; width: 100%; height: 100%; position: relative; overflow: hidden; background: #000; }
        .sidebar { width: 380px; border-right: 1px solid #222; display: flex; flex-direction: column; height: 100%; background: #000; z-index: 10; position: relative; }

        /* Bottom Navigation Bar - Pure Black */
        .bottom-nav { display: flex; background: #000000; border-top: 1px solid #222; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)) 8px; justify-content: space-around; align-items: center; z-index: 20; box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5); flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--text-secondary); font-size: 10.5px; font-weight: 600; flex: 1; padding: 4px 2px; border-radius: 12px; }
        .nav-item.active { color: var(--telegram-blue); }
        .nav-item svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .logout-btn { background: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; max-width: 240px; margin-top: 12px; }
        .admin-btn { background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; max-width: 240px; margin-top: 12px; }
        
        /* TikTok Feed Section */
        #feedSection { display: flex; flex-direction: column; flex: 1; overflow: hidden; background: #000; position: relative; min-height: 0; }
        .tiktok-feed-container { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; height: 100%; position: relative; }
        .tiktok-feed-container::-webkit-scrollbar { display: none; }
        .tiktok-reel { width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        .tiktok-media-wrapper { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        .tiktok-media { width: 100%; height: 100%; object-fit: contain; max-width: 100%; border: none; background: #000; }

        /* Admin Panel Modal */
        #adminModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3300; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 15px; }
        .admin-card { background: #181818; color: #fff; width: 100%; max-width: 450px; max-height: 85vh; border-radius: 28px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #333; }
        
        .admin-search-input { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #333; background: #222; color: #fff; outline: none; font-size: 14px; margin-bottom: 12px; }
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
        .admin-tab-btn { flex: 1; padding: 8px; border-radius: 10px; border: none; background: #222; color: var(--text-secondary); font-weight: 600; cursor: pointer; font-size: 13px; }
        .admin-tab-btn.active { background: var(--telegram-blue); color: white; }

        .admin-list-container { flex: 1; overflow-y: auto; border: 1px solid #333; border-radius: 14px; padding: 8px; margin-bottom: 12px; max-height: 320px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #222; gap: 10px; }
        .admin-item:last-child { border-bottom: none; }
        .admin-action-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
        
        .admin-post-info { display: flex; align-items: center; gap: 10px; overflow: hidden; flex: 1; }
        .admin-post-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #222; flex-shrink: 0; }

        @media(max-width: 768px) {
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal">
        <div class="custom-alert-card">
            <div style="font-size: 40px; margin-bottom: 12px;" id="customAlertIcon">⚠️</div>
            <h3 id="customAlertTitle" style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Notice</h3>
            <p id="customAlertMessage" style="font-size: 14px; color: #879099; line-height: 1.4;">Message goes here...</p>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminModal" onclick="closeAdminModal(event)">
        <div class="admin-card" onclick="event.stopPropagation()">
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Admin Control Panel</h3>
            
            <div class="admin-tabs">
                <button class="admin-tab-btn active" id="adminTabUsersBtn" onclick="switchAdminTab('users')">Manage Users</button>
                <button class="admin-tab-btn" id="adminTabPostsBtn" onclick="switchAdminTab('posts')">Manage Posts</button>
            </div>

            <input type="text" id="adminSearchInput" class="admin-search-input" placeholder="Search..." oninput="filterAdminList()">

            <div class="admin-list-container" id="adminListContainer"></div>

            <button onclick="closeAdminModal()" style="width:100%; padding:10px; background:#222; color:#fff; border:none; border-radius:12px; font-weight:600; cursor:pointer; font-size:14px;">Close</button>
        </div>
    </div>

    <!-- Main App -->
    <div class="app">
        <section class="sidebar">
            <div id="feedSection">
                <div class="tiktok-feed-container" id="tiktokFeedContainer"></div>
            </div>

            <div id="profileSection" style="display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 24px; text-align: center; background: #000;">
                <div id="profileAvatar" class="avatar" style="width: 80px; height: 80px; font-size: 32px; background: var(--telegram-blue); margin-bottom: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700;">Q</div>
                <h2 id="profileUsername" style="font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">@visitor</h2>
                <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 24px;">QUO Viewer</p>
                
                <button id="adminPanelBtn" class="admin-btn" onclick="openAdminModal()">⚙️ Admin Panel</button>
            </div>

            <div class="bottom-nav">
                <div class="nav-item active" id="tabFeedBtn" onclick="switchTab('feed')">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    <span>Home</span>
                </div>

                <div class="nav-item" id="tabProfileBtn" onclick="switchTab('profile')">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Profile</span>
                </div>
            </div>
        </section>
    </div>

    <script>
        const SERVER_URL = "https://a-pmwt.onrender.com"; 
        const socket = io(SERVER_URL);

        let globalPosts = [];
        let globalUsers = [];
        let currentAdminTab = 'users';

        function showAlert(message, title = "Notice", icon = "⚠️") {
            document.getElementById("customAlertTitle").textContent = title;
            document.getElementById("customAlertMessage").textContent = message;
            document.getElementById("customAlertIcon").textContent = icon;
            document.getElementById("customAlertModal").style.display = "flex";
        }
        function closeCustomAlert() {
            document.getElementById("customAlertModal").style.display = "none";
        }

        window.onload = async function() {
            socket.emit("join", "visitor");
            fetchPosts();
        };

        async function fetchPosts(forceRandom = false) {
            try {
                const res = await fetch(SERVER_URL + "/api/posts");
                const allPosts = await res.json();
                
                globalPosts = forceRandom ? shufflePosts(allPosts) : allPosts;
                renderFeedPosts();

                const container = document.getElementById("tiktokFeedContainer");
                if (container) container.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) { console.error(e); }
        }

        function shufflePosts(posts) {
            let arr = [...posts];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function switchTab(tab) {
            if (tab === 'profile') stopAllVideos();

            if (tab === 'feed') {
                document.getElementById("feedSection").style.display = "flex";
                document.getElementById("profileSection").style.display = "none";
                document.getElementById("tabFeedBtn").classList.add("active");
                document.getElementById("tabProfileBtn").classList.remove("active");
                
                stopAllVideos();
                fetchPosts(true);
            } else {
                document.getElementById("feedSection").style.display = "none";
                document.getElementById("profileSection").style.display = "flex";
                document.getElementById("tabProfileBtn").classList.add("active");
                document.getElementById("tabFeedBtn").classList.remove("active");
            }
        }

        async function openAdminModal() {
            document.getElementById("adminModal").style.display = "flex";
            document.getElementById("adminSearchInput").value = "";
            await loadAdminData();
        }
        function closeAdminModal(e) {
            if (!e || e.target.id === 'adminModal') {
                document.getElementById("adminModal").style.display = "none";
            }
        }

        function switchAdminTab(tab) {
            currentAdminTab = tab;
            document.getElementById("adminTabUsersBtn").classList.toggle("active", tab === 'users');
            document.getElementById("adminTabPostsBtn").classList.toggle("active", tab === 'posts');
            document.getElementById("adminSearchInput").value = "";
            renderAdminList();
        }

        async function loadAdminData() {
            try {
                const resUsers = await fetch(SERVER_URL + "/api/admin/users?adminUser=admin");
                const dataUsers = await resUsers.json();
                if (dataUsers.success) globalUsers = dataUsers.users;

                await fetchPosts();
                renderAdminList();
            } catch (err) {
                console.error(err);
            }
        }

        function renderAdminList() {
            const container = document.getElementById("adminListContainer");
            const keyword = document.getElementById("adminSearchInput").value.trim().toLowerCase();
            container.innerHTML = "";

            if (currentAdminTab === 'users') {
                const filteredUsers = globalUsers.filter(u => u.toLowerCase().includes(keyword));
                if (filteredUsers.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:15px; color:#879099; font-size:13.5px;">No users found</div>`;
                    return;
                }
                filteredUsers.forEach(user => {
                    const item = document.createElement("div");
                    item.className = "admin-item";
                    item.innerHTML = `
                        <span style="font-weight:600; font-size:13.5px;">@${user}</span>
                        ${user !== 'admin' ? `<button class="admin-action-btn" onclick="deleteUser('${user}')">Delete</button>` : `<span style="font-size:12px; color:#10b981; font-weight:600;">Admin</span>`}
                    `;
                    container.appendChild(item);
                });
            } else {
                const filteredPosts = globalPosts.filter(p => (p.text && p.text.toLowerCase().includes(keyword)) || (p.author && p.author.toLowerCase().includes(keyword)));
                if (filteredPosts.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:15px; color:#879099; font-size:13.5px;">No posts found</div>`;
                    return;
                }
                filteredPosts.forEach(post => {
                    const item = document.createElement("div");
                    item.className = "admin-item";
                    
                    let thumbHtml = `<div class="admin-post-thumb" style="display:flex; align-items:center; justify-content:center; color:#879099; font-size:11px;">No Media</div>`;
                    if (post.media) {
                        let mediaSrc = post.media;
                        if (mediaSrc.includes('youtube.com/embed/')) {
                            let videoId = mediaSrc.split('embed/')[1]?.split('?')[0];
                            if (videoId) {
                                mediaSrc = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                            }
                        }
                        thumbHtml = `<img src="${mediaSrc}" class="admin-post-thumb" onerror="this.style.display='none'">`;
                    }

                    item.innerHTML = `
                        <div class="admin-post-info">
                            ${thumbHtml}
                            <div style="overflow:hidden;">
                                <div style="font-size:13px; font-weight:600; color:var(--text-primary);">@${post.author}</div>
                                <div style="font-size:12px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">YouTube Video Link</div>
                            </div>
                        </div>
                        <button class="admin-action-btn" onclick="deletePost('${post.id || post.timestamp}')">Delete</button>
                    `;
                    container.appendChild(item);
                });
            }
        }

        function filterAdminList() {
            renderAdminList();
        }

        async function deleteUser(usernameToDelete) {
            if (!confirm(`Are you sure you want to delete user @${usernameToDelete}?`)) return;

            try {
                const res = await fetch(SERVER_URL + "/api/admin/user", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ adminUser: "admin", usernameToDelete })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert(`User @${usernameToDelete} deleted!`, "Success", "✅");
                    await loadAdminData();
                    fetchPosts();
                } else {
                    showAlert(data.message || "Failed.");
                }
            } catch (err) { showAlert("Error"); }
        }

        async function deletePost(postId) {
            if (!confirm("Are you sure you want to delete this post?")) return;

            try {
                const res = await fetch(SERVER_URL + `/api/posts/${postId}`, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ adminUser: "admin" })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert("Post deleted!", "Success", "✅");
                    await loadAdminData();
                    fetchPosts();
                } else {
                    showAlert(data.message || "Failed.");
                }
            } catch (err) { showAlert("Error"); }
        }

        function stopAllVideos() {
            const wrappers = document.querySelectorAll('.tiktok-media-wrapper');
            wrappers.forEach(wrapper => wrapper.innerHTML = '');
        }

        function renderFeedPosts() {
            const container = document.getElementById("tiktokFeedContainer");
            container.innerHTML = "";

            if (globalPosts.length === 0) {
                container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#fff;"><p>No posts available.</p></div>`;
                return;
            }

            globalPosts.forEach((post) => {
                const reel = document.createElement("div");
                reel.className = "tiktok-reel";
                
                reel.innerHTML = `
                    <div class="tiktok-media-wrapper" data-media="${post.media || ''}" data-type="${post.mediaType || 'iframe'}"></div>
                `;
                container.appendChild(reel);
            });

            setupVideoObserver();
        }

        function setupVideoObserver() {
            const container = document.getElementById("tiktokFeedContainer");
            const reels = container.querySelectorAll(".tiktok-reel");

            const observerOptions = {
                root: container,
                threshold: 0.6
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const wrapper = entry.target.querySelector('.tiktok-media-wrapper');
                    if (!wrapper) return;

                    const mediaUrl = wrapper.getAttribute('data-media');

                    if (entry.isIntersecting) {
                        if (mediaUrl && wrapper.innerHTML === '') {
                            wrapper.innerHTML = `<iframe class="tiktok-media" src="${mediaUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                        }
                    } else {
                        wrapper.innerHTML = '';
                    }
                });
            }, observerOptions);

            reels.forEach(reel => observer.observe(reel));
        }
    </script>
</body>
</html>
