<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QUO - Social & Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-main: #000;
            --bg-chat: #121212;
            --bg-header: #000;
            --text-primary: #ffffff;
            --text-secondary: #879099;
            --bg-hover: #1a1a1a;
            --telegram-blue: #3390ec;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            background: #000; 
            color: var(--text-primary); 
            height: 100vh; 
            height: 100dvh; 
            width: 100%;
            overflow: hidden; 
            display: flex; 
            position: fixed;
            inset: 0;
        }

        /* Auth Overlay */
        #authOverlay { position: fixed; inset: 0; background: rgba(15,23,42,0.85); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #181818; color: #fff; border-radius: 28px; width: 100%; max-width: 380px; padding: 32px 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #333; }
        .card input { width: 100%; padding: 14px 18px; border-radius: 14px; border: 1.5px solid #333; background: #222; color: #fff; margin-top: 8px; margin-bottom: 14px; outline: none; font-size: 15px; }
        .card input:focus { border-color: var(--telegram-blue); }
        .card button { width: 100%; padding: 14px; border-radius: 14px; background: var(--telegram-blue); color: white; border: none; font-weight: 600; cursor: pointer; font-size: 16px; margin-top: 6px; }
        .switch-auth { margin-top: 16px; font-size: 13.5px; color: var(--telegram-blue); cursor: pointer; font-weight: 500; }

        /* Custom Alert Modal */
        #customAlertModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 3500; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 20px; }
        .custom-alert-card { background: #181818; color: #fff; width: 100%; max-width: 320px; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #333; }
        .custom-alert-btn { width: 100%; padding: 12px; border-radius: 14px; background: var(--telegram-blue); color: white; border: none; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 15px; }

        /* App Layout */
        .app { display: flex; width: 100%; height: 100%; position: relative; overflow: hidden; background: #000; }
        .sidebar { width: 100%; max-width: 480px; margin: 0 auto; border-right: 1px solid #222; border-left: 1px solid #222; display: flex; flex-direction: column; height: 100%; background: #000; z-index: 10; position: relative; }

        /* Bottom Navigation Bar - Pure Black */
        .bottom-nav { display: flex; background: #000000; border-top: 1px solid #222; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)) 8px; justify-content: space-around; align-items: center; z-index: 20; box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5); flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--text-secondary); font-size: 10.5px; font-weight: 600; flex: 1; padding: 4px 2px; border-radius: 12px; }
        .nav-item.active { color: var(--telegram-blue); }
        .nav-item svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .nav-upload-btn { background: var(--telegram-blue); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 4px 12px rgba(51, 144, 236, 0.35); transition: transform 0.15s; }
        .nav-upload-btn:active { transform: scale(0.95); }

        .logout-btn { background: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; max-width: 240px; margin-top: 12px; }
        .admin-btn { background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; max-width: 240px; margin-top: 12px; }
        
        /* TikTok Feed Section */
        #feedSection { display: flex; flex-direction: column; flex: 1; overflow: hidden; background: #000; position: relative; min-height: 0; }
        .tiktok-feed-container { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; height: 100%; position: relative; }
        .tiktok-feed-container::-webkit-scrollbar { display: none; }
        .tiktok-reel { width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        .tiktok-media-wrapper { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        .tiktok-media { width: 100%; height: 100%; object-fit: contain; max-width: 100%; border: none; background: #000; }

        /* TikTok Right Action Buttons Overlay */
        .tiktok-actions { position: absolute; right: 16px; bottom: 80px; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .action-btn-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 50%; backdrop-filter: blur(4px); }
        .action-btn-item svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .action-btn-item.liked svg { fill: #ef4444; stroke: #ef4444; }
        .action-btn-text { color: #fff; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        /* TikTok Meta Info Overlay */
        .tiktok-meta { position: absolute; left: 16px; bottom: 80px; right: 80px; z-index: 10; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); pointer-events: none; }
        .tiktok-author { font-size: 16px; font-weight: 700; margin-bottom: 6px; pointer-events: auto; cursor: pointer; }
        .tiktok-caption { font-size: 14px; opacity: 0.9; line-height: 1.35; }

        /* Comments Modal */
        #commentsModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 3100; align-items: flex-end; backdrop-filter: blur(4px); }
        .comments-card { background: #181818; color: #fff; width: 100%; height: 60vh; border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,0.6); border-top: 1px solid #333; }
        .comments-list { flex: 1; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px; }
        .comment-item { display: flex; flex-direction: column; gap: 2px; background: #222; padding: 10px 14px; border-radius: 14px; }
        .comment-input-box { display: flex; gap: 8px; }
        .comment-input-box input { flex: 1; padding: 12px 16px; border-radius: 14px; border: 1.5px solid #333; background: #222; color: #fff; outline: none; font-size: 14px; }
        .comment-input-box button { padding: 0 20px; border-radius: 14px; background: var(--telegram-blue); color: white; border: none; font-weight: 600; cursor: pointer; }

        /* Chat Section */
        #chatSection { display: none; flex-direction: column; flex: 1; background: var(--bg-chat); height: 100%; overflow: hidden; }
        .chat-header { padding: 14px 18px; background: #000; border-bottom: 1px solid #222; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: space-between; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .chat-bubble.sent { background: var(--telegram-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-bubble.received { background: #222; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-input-area { padding: 12px 16px; background: #000; border-top: 1px solid #222; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px 16px; border-radius: 20px; border: 1.5px solid #333; background: #1a1a1a; color: white; outline: none; font-size: 14px; }
        .chat-input-area button { background: var(--telegram-blue); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

        /* Admin Panel Modal */
        #adminModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3300; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 15px; }
        .admin-card { background: #181818; color: #fff; width: 100%; max-width: 450px; max-height: 85vh; border-radius: 28px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #333; }
        
        .admin-search-input { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #333; background: #222; color: #fff; outline: none; font-size: 14px; margin-bottom: 12px; }
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
        .admin-tab-btn { flex: 1; padding: 8px; border-radius: 10px; border: none; background: #222; color: var(--text-secondary); font-weight: 600; cursor: pointer; font-size: 13px; }
        .admin-tab-btn.active { background: var(--telegram-blue); color: white; }

        .admin-list-container { flex: 1; overflow-y: auto; border: 1px solid #333; border-radius: 14px; padding: 8px; margin-bottom: 12px; max-height: 320px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #222; gap: 10px; }
        .admin-item:last-child { border-bottom: none; }
        .admin-action-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
        
        .admin-post-info { display: flex; align-items: center; gap: 10px; overflow: hidden; flex: 1; }
        .admin-post-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #222; flex-shrink: 0; }

        /* Upload Modal */
        #tiktokUploadModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3200; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 20px; }
        .tiktok-upload-card { background: #181818; color: #fff; width: 100%; max-width: 360px; border-radius: 28px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #333; }
    </style>
</head>
<body>

    <!-- Auth Overlay -->
    <div id="authOverlay">
        <div class="card" id="authCard">
            <div style="font-size: 44px; margin-bottom: 10px;">💬</div>
            <h2 id="authTitle" style="font-size: 22px; font-weight: 700; color: #fff;">QUO - Register</h2>
            <p id="authSubtitle" style="font-size: 13.5px; color: #879099; margin: 8px 0 20px;">Create a username and password.</p>
            
            <input type="text" id="authUsername" placeholder="Username">
            <input type="password" id="authPassword" placeholder="Password">
            
            <button id="authBtn" onclick="handleAuth()">Sign Up</button>
            <div class="switch-auth" id="switchAuthText" onclick="toggleAuthMode()">Already have an account? Log In</div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal">
        <div class="custom-alert-card">
            <div style="font-size: 40px; margin-bottom: 12px;" id="customAlertIcon">⚠️</div>
            <h3 id="customAlertTitle" style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Notice</h3>
            <p id="customAlertMessage" style="font-size: 14px; color: #879099; line-height: 1.4;">Message goes here...</p>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <!-- Comments Modal -->
    <div id="commentsModal" onclick="closeCommentsModal(event)">
        <div class="comments-card" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 id="commentsTitle" style="font-size: 16px; font-weight: 700;">Comments</h3>
                <span onclick="closeCommentsModal()" style="cursor:pointer; font-size:20px; color:#879099;">&times;</span>
            </div>
            <div class="comments-list" id="commentsListContainer"></div>
            <div class="comment-input-box">
                <input type="text" id="commentInputText" placeholder="Add a comment...">
                <button onclick="postComment()">Post</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminModal" onclick="closeAdminModal(event)">
        <div class="admin-card" onclick="event.stopPropagation()">
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Admin Control Panel</h3>
            
            <div class="admin-tabs">
                <button class="admin-tab-btn active" id="adminTabUsersBtn" onclick="switchAdminTab('users')">Manage Users</button>
                <button class="admin-tab-btn" id="adminTabPostsBtn" onclick="switchAdminTab('posts')">Manage Posts</button>
            </div>

            <input type="text" id="adminSearchInput" class="admin-search-input" placeholder="Search..." oninput="filterAdminList()">

            <div class="admin-list-container" id="adminListContainer"></div>

            <button onclick="closeAdminModal()" style="width:100%; padding:10px; background:#222; color:#fff; border:none; border-radius:12px; font-weight:600; cursor:pointer; font-size:14px;">Close</button>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="tiktokUploadModal" onclick="closeTiktokUpload(event)">
        <div class="tiktok-upload-card" onclick="event.stopPropagation()">
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 12px;">Create Reel / Post</h3>
            <input type="text" id="postCaptionInput" placeholder="Write a caption..." style="width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #333; background: #222; color: #fff; outline: none; font-size: 14px; margin-bottom: 10px;">
            <input type="text" id="postMediaUrlInput" placeholder="Paste YouTube link..." style="width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #333; background: #222; color: #fff; outline: none; font-size: 14px; margin-bottom: 14px;">
            <button onclick="createPost()" style="width:100%; padding:12px; background:var(--telegram-blue); color:white; border:none; border-radius:14px; font-weight:600; cursor:pointer; font-size:15px; margin-bottom:8px;">Post</button>
            <button onclick="closeTiktokUpload()" style="width:100%; background:none; border:none; color:#879099; cursor:pointer; font-size:13.5px; font-weight:600;">Cancel</button>
        </div>
    </div>

    <!-- Main App -->
    <div class="app">
        <section class="sidebar">
            <div id="feedSection">
                <div class="tiktok-feed-container" id="tiktokFeedContainer"></div>
            </div>

            <div id="chatSection">
                <div class="chat-header">
                    <span id="chatPartnerName">Select a chat</span>
                </div>
                <div class="chat-messages" id="chatMessagesContainer"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatMessageInput" placeholder="Type a message...">
                    <button onclick="sendChatMessage()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>

            <div id="profileSection" style="display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 24px; text-align: center; background: #000;">
                <div id="profileAvatar" class="avatar" style="width: 80px; height: 80px; font-size: 32px; background: var(--telegram-blue); margin-bottom: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700;">?</div>
                <h2 id="profileUsername" style="font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);"></h2>
                <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 24px;">Logged in user</p>
                
                <button id="adminPanelBtn" class="admin-btn" style="display: none;" onclick="openAdminModal()">⚙️ Admin Panel</button>
                <button class="logout-btn" onclick="logout()">Log Out</button>
            </div>

            <div class="bottom-nav">
                <div class="nav-item active" id="tabFeedBtn" onclick="switchTab('feed')">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    <span>Home</span>
                </div>

                <div class="nav-item" id="tabChatBtn" onclick="switchTab('chat')">
                    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span>Chat</span>
                </div>
                
                <button class="nav-upload-btn" onclick="openTiktokUpload()">+ Upload</button>

                <div class="nav-item" id="tabProfileBtn" onclick="switchTab('profile')">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Profile</span>
                </div>
            </div>
        </section>
    </div>

    <script>
        const SERVER_URL = "http://localhost:3000"; 
        const socket = io(SERVER_URL);

        let isLoginMode = false;
        let currentLoggedInUser = localStorage.getItem("quo_logged_in_user") || "";
        let globalPosts = [];
        let globalUsers = [];
        let currentAdminTab = 'users';
        let currentActivePostId = null;
        let activeChatUser = 'admin';

        function showAlert(message, title = "Notice", icon = "⚠️") {
            document.getElementById("customAlertTitle").textContent = title;
            document.getElementById("customAlertMessage").textContent = message;
            document.getElementById("customAlertIcon").textContent = icon;
            document.getElementById("customAlertModal").style.display = "flex";
        }
        function closeCustomAlert() {
            document.getElementById("customAlertModal").style.display = "none";
        }

        window.onload = async function() {
            if (currentLoggedInUser) {
                document.getElementById("authOverlay").style.display = "none";
                socket.emit("join", currentLoggedInUser);
                fetchPosts();
                setupProfileInfo();
            } else {
                document.getElementById("authOverlay").style.display = "flex";
                toggleAuthMode(true);
            }

            socket.on("receive_message", (data) => {
                if (data.sender === activeChatUser || data.receiver === activeChatUser) {
                    appendChatMessage(data);
                }
            });
        };

        function logout() {
            localStorage.removeItem("quo_logged_in_user");
            location.reload();
        }

        function toggleAuthMode(forceLogin = false) {
            isLoginMode = forceLogin ? true : !isLoginMode;
            document.getElementById("authTitle").textContent = isLoginMode ? "QUO - Login" : "QUO - Register";
            document.getElementById("authBtn").textContent = isLoginMode ? "Log In" : "Sign Up";
            document.getElementById("switchAuthText").textContent = isLoginMode ? "Don't have an account? Register" : "Already have an account? Log In";
        }

        async function handleAuth() {
            const username = document.getElementById("authUsername").value.trim().toLowerCase();
            const password = document.getElementById("authPassword").value.trim();

            if (!username || !password) {
                showAlert("Please enter username and password!");
                return;
            }

            const endpoint = isLoginMode ? "/api/login" : "/api/register";
            try {
                const response = await fetch(SERVER_URL + endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    if (isLoginMode) {
                        currentLoggedInUser = data.username;
                        localStorage.setItem("quo_logged_in_user", data.username);
                        document.getElementById("authOverlay").style.display = "none";
                        socket.emit("join", data.username);
                        fetchPosts();
                        setupProfileInfo();
                    } else {
                        showAlert("Registered successfully! Please log in.", "Success", "✅");
                        toggleAuthMode(true);
                    }
                } else {
                    showAlert(data.message || "Authentication failed!");
                }
            } catch (err) {
                showAlert("Cannot connect to server!");
            }
        }

        async function fetchPosts(forceRandom = false) {
            try {
                const res = await fetch(SERVER_URL + "/api/posts");
                const allPosts = await res.json();
                
                globalPosts = allPosts;
                renderFeedPosts();
            } catch (e) { console.error(e); }
        }

        function setupProfileInfo() {
            if (currentLoggedInUser) {
                document.getElementById("profileUsername").textContent = "@" + currentLoggedInUser;
                document.getElementById("profileAvatar").textContent = currentLoggedInUser.charAt(0).toUpperCase();

                if (currentLoggedInUser === "admin") {
                    document.getElementById("adminPanelBtn").style.display = "block";
                } else {
                    document.getElementById("adminPanelBtn").style.display = "none";
                }
            }
        }

        function switchTab(tab) {
            if (tab === 'profile' || tab === 'chat') stopAllVideos();

            document.getElementById("feedSection").style.display = tab === 'feed' ? "flex" : "none";
            document.getElementById("chatSection").style.display = tab === 'chat' ? "flex" : "none";
            document.getElementById("profileSection").style.display = tab === 'profile' ? "flex" : "none";

            document.getElementById("tabFeedBtn").classList.toggle("active", tab === 'feed');
            document.getElementById("tabChatBtn").classList.toggle("active", tab === 'chat');
            document.getElementById("tabProfileBtn").classList.toggle("active", tab === 'profile');
            
            if (tab === 'feed') {
                stopAllVideos();
                fetchPosts();
            } else if (tab === 'profile') {
                setupProfileInfo();
            } else if (tab === 'chat') {
                document.getElementById("chatPartnerName").textContent = "Chat with @admin";
            }
        }

        function openTiktokUpload() { document.getElementById("tiktokUploadModal").style.display = "flex"; }
        function closeTiktokUpload() { document.getElementById("tiktokUploadModal").style.display = "none"; }

        async function openAdminModal() {
            document.getElementById("adminModal").style.display = "flex";
            document.getElementById("adminSearchInput").value = "";
            await loadAdminData();
        }
        function closeAdminModal(e) {
            if (!e || e.target.id === 'adminModal') {
                document.getElementById("adminModal").style.display = "none";
            }
        }

        function switchAdminTab(tab) {
            currentAdminTab = tab;
            document.getElementById("adminTabUsersBtn").classList.toggle("active", tab === 'users');
            document.getElementById("adminTabPostsBtn").classList.toggle("active", tab === 'posts');
            document.getElementById("adminSearchInput").value = "";
            renderAdminList();
        }

        async function loadAdminData() {
            try {
                const resUsers = await fetch(SERVER_URL + "/api/admin/users?adminUser=" + currentLoggedInUser);
                const dataUsers = await resUsers.json();
                if (dataUsers.success) globalUsers = dataUsers.users;

                await fetchPosts();
                renderAdminList();
            } catch (err) { console.error(err); }
        }

        function renderAdminList() {
            const container = document.getElementById("adminListContainer");
            const keyword = document.getElementById("adminSearchInput").value.trim().toLowerCase();
            container.innerHTML = "";

            if (currentAdminTab === 'users') {
                const filteredUsers = globalUsers.filter(u => u.toLowerCase().includes(keyword));
                filteredUsers.forEach(user => {
                    const item = document.createElement("div");
                    item.className = "admin-item";
                    item.innerHTML = `
                        <span style="font-weight:600; font-size:13.5px;">@${user}</span>
                        ${user !== 'admin' ? `<button class="admin-action-btn" onclick="deleteUser('${user}')">Delete</button>` : `<span style="font-size:12px; color:#10b981; font-weight:600;">Admin</span>`}
                    `;
                    container.appendChild(item);
                });
            } else {
                const filteredPosts = globalPosts.filter(p => (p.text && p.text.toLowerCase().includes(keyword)) || (p.author && p.author.toLowerCase().includes(keyword)));
                filteredPosts.forEach(post => {
                    const item = document.createElement("div");
                    item.className = "admin-item";
                    item.innerHTML = `
                        <div class="admin-post-info">
                            <div style="overflow:hidden;">
                                <div style="font-size:13px; font-weight:600; color:var(--text-primary);">@${post.author}</div>
                                <div style="font-size:12px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${post.text || 'YouTube Video'}</div>
                            </div>
                        </div>
                        <button class="admin-action-btn" onclick="deletePost('${post.id}')">Delete</button>
                    `;
                    container.appendChild(item);
                });
            }
        }

        function filterAdminList() { renderAdminList(); }

        async function deleteUser(usernameToDelete) {
            if (!confirm(`Are you sure you want to delete user @${usernameToDelete}?`)) return;
            const res = await fetch(SERVER_URL + "/api/admin/user", {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ adminUser: currentLoggedInUser, usernameToDelete })
            });
            const data = await res.json();
            if (data.success) {
                if (usernameToDelete === currentLoggedInUser) logout();
                else loadAdminData();
            }
        }

        async function deletePost(postId) {
            if (!confirm("Are you sure you want to delete this post?")) return;
            const res = await fetch(SERVER_URL + `/api/posts/${postId}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ adminUser: currentLoggedInUser })
            });
            const data = await res.json();
            if (data.success) {
                loadAdminData();
                fetchPosts();
            }
        }

        function parseMediaUrl(url) {
            url = url.trim();
            let result = { type: 'iframe', src: url };
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = "";
                if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
                else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0];
                else if (url.includes('embed/')) videoId = url.split('embed/')[1]?.split('?')[0];
                if (videoId) {
                    result.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1&controls=1&enablejsapi=1&rel=0`;
                }
            }
            return result;
        }

        async function createPost() {
            const mediaUrl = document.getElementById("postMediaUrlInput").value.trim();
            const caption = document.getElementById("postCaptionInput").value.trim();
            if (!mediaUrl) return showAlert("Please paste a YouTube link!");

            let parsed = parseMediaUrl(mediaUrl);
            const newPost = {
                author: currentLoggedInUser,
                text: caption,
                media: parsed.src,
                mediaType: parsed.type,
                time: new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }),
                timestamp: Date.now()
            };

            await fetch(SERVER_URL + "/api/posts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newPost)
            });

            document.getElementById("postMediaUrlInput").value = "";
            document.getElementById("postCaptionInput").value = "";
            closeTiktokUpload();
            fetchPosts();
        }

        function stopAllVideos() {
            document.querySelectorAll('.tiktok-media-wrapper').forEach(w => w.innerHTML = '');
        }

        async function renderFeedPosts() {
            const container = document.getElementById("tiktokFeedContainer");
            container.innerHTML = "";

            if (globalPosts.length === 0) {
                container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#fff;"><p>No posts available.</p></div>`;
                return;
            }

            for (const post of globalPosts) {
                const reel = document.createElement("div");
                reel.className = "tiktok-reel";
                
                // Fetch likes count
                let likesCount = 0;
                try {
                    const lRes = await fetch(SERVER_URL + `/api/posts/${post.id}/likes`);
                    const lData = await lRes.json();
                    likesCount = lData.count || 0;
                } catch(e) {}

                reel.innerHTML = `
                    <div class="tiktok-media-wrapper" data-media="${post.media || ''}"></div>
                    <div class="tiktok-meta">
                        <div class="tiktok-author" onclick="openChatWithUser('${post.author}')">@${post.author}</div>
                        <div class="tiktok-caption">${post.text || ''}</div>
                    </div>
                    <div class="tiktok-actions">
                        <div class="action-btn-item" onclick="toggleLike(${post.id}, this)">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <span class="action-btn-text" id="likeCount-${post.id}">${likesCount}</span>
                        </div>
                        <div class="action-btn-item" onclick="openComments(${post.id})">
                            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            <span class="action-btn-text">Comment</span>
                        </div>
                    </div>
                `;
                container.appendChild(reel);
            }

            setupVideoObserver();
        }

        async function toggleLike(postId, el) {
            const res = await fetch(SERVER_URL + `/api/posts/${postId}/like`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: currentLoggedInUser })
            });
            const data = await res.json();
            if (data.success) {
                el.classList.toggle("liked", data.liked);
                const countEl = document.getElementById(`likeCount-${postId}`);
                let currentCount = parseInt(countEl.textContent || '0');
                countEl.textContent = data.liked ? currentCount + 1 : Math.max(0, currentCount - 1);
            }
        }

        async function openComments(postId) {
            currentActivePostId = postId;
            document.getElementById("commentsModal").style.display = "flex";
            loadComments(postId);
        }
        function closeCommentsModal(e) {
            if (!e || e.target.id === 'commentsModal') {
                document.getElementById("commentsModal").style.display = "none";
            }
        }

        async function loadComments(postId) {
            const container = document.getElementById("commentsListContainer");
            container.innerHTML = "Loading...";
            try {
                const res = await fetch(SERVER_URL + `/api/posts/${postId}/comments`);
                const comments = await res.json();
                container.innerHTML = "";
                if (comments.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:#879099; padding:20px;">No comments yet.</div>`;
                    return;
                }
                comments.forEach(c => {
                    const item = document.createElement("div");
                    item.className = "comment-item";
                    item.innerHTML = `
                        <div style="font-size:12px; font-weight:700; color:var(--telegram-blue);">@${c.username}</div>
                        <div style="font-size:13.5px; color:#fff;">${c.comment}</div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) { container.innerHTML = "Failed to load comments."; }
        }

        async function postComment() {
            const input = document.getElementById("commentInputText");
            const comment = input.value.trim();
            if (!comment || !currentActivePostId) return;

            await fetch(SERVER_URL + `/api/posts/${currentActivePostId}/comments`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: currentLoggedInUser, comment, time: new Date().toLocaleTimeString() })
            });
            input.value = "";
            loadComments(currentActivePostId);
        }

        function openChatWithUser(username) {
            if (username === currentLoggedInUser) return;
            activeChatUser = username;
            switchTab('chat');
            document.getElementById("chatPartnerName").textContent = "Chat with @" + username;
            document.getElementById("chatMessagesContainer").innerHTML = "";
        }

        function sendChatMessage() {
            const input = document.getElementById("chatMessageInput");
            const message = input.value.trim();
            if (!message) return;

            const data = {
                sender: currentLoggedInUser,
                receiver: activeChatUser,
                message,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            socket.emit("send_message", data);
            input.value = "";
        }

        function appendChatMessage(data) {
            const container = document.getElementById("chatMessagesContainer");
            const bubble = document.createElement("div");
            bubble.className = `chat-bubble ${data.sender === currentLoggedInUser ? 'sent' : 'received'}`;
            bubble.textContent = data.message;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        function setupVideoObserver() {
            const container = document.getElementById("tiktokFeedContainer");
            const reels = container.querySelectorAll(".tiktok-reel");
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const wrapper = entry.target.querySelector('.tiktok-media-wrapper');
                    if (!wrapper) return;
                    const mediaUrl = wrapper.getAttribute('data-media');
                    if (entry.isIntersecting) {
                        if (mediaUrl && wrapper.innerHTML === '') {
                            wrapper.innerHTML = `<iframe class="tiktok-media" src="${mediaUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                        }
                    } else {
                        wrapper.innerHTML = '';
                    }
                });
            }, { root: container, threshold: 0.6 });
            reels.forEach(reel => observer.observe(reel));
        }
    </script>
</body>
</html>
