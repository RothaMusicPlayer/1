<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QUO - Social & Chat</title>
    <!-- Socket.io Client Script -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-chat: #f0f2f5;
            --bg-header: #3390ec;
            --text-primary: #1c242b;
            --text-secondary: #879099;
            --bg-hover: #f8fafc;
            --telegram-blue: #3390ec;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            background: var(--bg-main); 
            color: var(--text-primary); 
            height: 100vh; 
            height: 100dvh; 
            width: 100%;
            overflow: hidden; 
            display: flex; 
            position: fixed;
            inset: 0;
        }

        /* Auth Overlay */
        #authOverlay { position: fixed; inset: 0; background: rgba(15,23,42,0.7); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 28px; width: 100%; max-width: 380px; padding: 32px 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .card input { width: 100%; padding: 14px 18px; border-radius: 14px; border: 1.5px solid #e2e8f0; margin-top: 8px; margin-bottom: 14px; outline: none; font-size: 15px; }
        .card input:focus { border-color: var(--telegram-blue); }
        .card button { width: 100%; padding: 14px; border-radius: 14px; background: var(--telegram-blue); color: white; border: none; font-weight: 600; cursor: pointer; font-size: 16px; margin-top: 6px; }
        .switch-auth { margin-top: 16px; font-size: 13.5px; color: var(--telegram-blue); cursor: pointer; font-weight: 500; }

        /* Custom Alert Modal */
        #customAlertModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3500; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 20px; }
        .custom-alert-card { background: #fff; width: 100%; max-width: 320px; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
        .custom-alert-btn { width: 100%; padding: 12px; border-radius: 14px; background: var(--telegram-blue); color: white; border: none; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 15px; }

        /* App Layout */
        .app { display: flex; width: 100%; height: 100%; position: relative; overflow: hidden; }
        .sidebar { width: 380px; border-right: 1px solid #e6e6e6; display: flex; flex-direction: column; height: 100%; background: #fff; z-index: 10; position: relative; }

        /* Bottom Navigation Bar */
        .bottom-nav { display: flex; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); border-top: 1px solid #edf2f7; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)) 8px; justify-content: space-around; align-items: center; z-index: 20; box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.04); flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--text-secondary); font-size: 10.5px; font-weight: 600; flex: 1; padding: 4px 2px; border-radius: 12px; }
        .nav-item.active { color: var(--telegram-blue); }
        .nav-item svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .nav-upload-btn { background: var(--telegram-blue); color: white; border: none; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 4px 12px rgba(51, 144, 236, 0.35); transition: transform 0.15s; }
        .nav-upload-btn:active { transform: scale(0.95); }

        .logout-btn { background: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; max-width: 240px; margin-top: 12px; }
        .admin-btn { background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; max-width: 240px; margin-top: 12px; }
        
        /* TikTok Feed Section */
        #feedSection { display: flex; flex-direction: column; flex: 1; overflow: hidden; background: #000; position: relative; min-height: 0; }
        .tiktok-feed-container { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; height: 100%; position: relative; }
        .tiktok-feed-container::-webkit-scrollbar { display: none; }
        .tiktok-reel { width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
        .tiktok-media-wrapper { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        .tiktok-media { width: 100%; height: 100%; object-fit: contain; max-width: 100%; border: none; background: #000; }
        
        /* CSS Overlay ដើម្បីបាំងប៊ូតុង YouTube ផ្នែកខាងលើ និងខាងក្រោម */
        .iframe-cover-top { position: absolute; top: 0; left: 0; width: 100%; height: 60px; z-index: 2; pointer-events: none; }
        .iframe-cover-bottom { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; z-index: 2; pointer-events: none; }

        .tiktok-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 30%); z-index: 3; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; }
        .tiktok-content-box { pointer-events: auto; max-width: 90%; }
        .tiktok-desc { color: white; font-size: 14.5px; line-height: 1.45; margin-bottom: 4px; word-break: break-word; }

        /* Admin Panel Modal */
        #adminModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 3300; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 15px; }
        .admin-card { background: #fff; width: 100%; max-width: 450px; max-height: 85vh; border-radius: 28px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; }
        
        .admin-search-input { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #e2e8f0; outline: none; font-size: 14px; margin-bottom: 12px; }
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
        .admin-tab-btn { flex: 1; padding: 8px; border-radius: 10px; border: none; background: #f1f5f9; color: var(--text-secondary); font-weight: 600; cursor: pointer; font-size: 13px; }
        .admin-tab-btn.active { background: var(--telegram-blue); color: white; }

        .admin-list-container { flex: 1; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 14px; padding: 8px; margin-bottom: 12px; max-height: 320px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #edf2f7; gap: 10px; }
        .admin-item:last-child { border-bottom: none; }
        .admin-action-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
        
        .admin-post-info { display: flex; align-items: center; gap: 10px; overflow: hidden; flex: 1; }
        .admin-post-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #f1f5f9; flex-shrink: 0; }

        /* Upload Modal */
        #tiktokUploadModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 3200; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 20px; }
        .tiktok-upload-card { background: #fff; width: 100%; max-width: 360px; border-radius: 28px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

        @media(max-width: 768px) {
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Auth Overlay -->
    <div id="authOverlay">
        <div class="card" id="authCard">
            <div style="font-size: 44px; margin-bottom: 10px;">💬</div>
            <h2 id="authTitle" style="font-size: 22px; font-weight: 700; color: #1c242b;">QUO - Register</h2>
            <p id="authSubtitle" style="font-size: 13.5px; color: #64748b; margin: 8px 0 20px;">Create a username and password.</p>
            
            <input type="text" id="authUsername" placeholder="Username">
            <input type="password" id="authPassword" placeholder="Password">
            
            <button id="authBtn" onclick="handleAuth()">Sign Up</button>
            <div class="switch-auth" id="switchAuthText" onclick="toggleAuthMode()">Already have an account? Log In</div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal">
        <div class="custom-alert-card">
            <div style="font-size: 40px; margin-bottom: 12px;" id="customAlertIcon">⚠️</div>
            <h3 id="customAlertTitle" style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Notice</h3>
            <p id="customAlertMessage" style="font-size: 14px; color: #64748b; line-height: 1.4;">Message goes here...</p>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminModal" onclick="closeAdminModal(event)">
        <div class="admin-card" onclick="event.stopPropagation()">
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Admin Control Panel</h3>
            
            <div class="admin-tabs">
                <button class="admin-tab-btn active" id="adminTabUsersBtn" onclick="switchAdminTab('users')">Manage Users</button>
                <button class="admin-tab-btn" id="adminTabPostsBtn" onclick="switchAdminTab('posts')">Manage Posts</button>
            </div>

            <input type="text" id="adminSearchInput" class="admin-search-input" placeholder="Search..." oninput="filterAdminList()">

            <div class="admin-list-container" id="adminListContainer">
                <!-- Items loaded dynamically -->
            </div>

            <button onclick="closeAdminModal()" style="width:100%; padding:10px; background:#e2e8f0; color:#1c242b; border:none; border-radius:12px; font-weight:600; cursor:pointer; font-size:14px;">Close</button>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="tiktokUploadModal" onclick="closeTiktokUpload(event)">
        <div class="tiktok-upload-card" onclick="event.stopPropagation()">
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 12px;">Create Reel / Post</h3>
            <textarea id="postTextInput" rows="3" placeholder="What's on your mind?..." style="width:100%; padding:12px 14px; border-radius:14px; border:1.5px solid #e2e8f0; outline:none; resize:none; font-size:14.5px; margin-bottom:12px;"></textarea>
            <input type="text" id="postMediaUrlInput" placeholder="Paste Link (YouTube, Facebook, Image)..." style="width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #e2e8f0; outline: none; font-size: 14px; margin-bottom: 14px;">
            <button onclick="createPost()" style="width:100%; padding:12px; background:var(--telegram-blue); color:white; border:none; border-radius:14px; font-weight:600; cursor:pointer; font-size:15px; margin-bottom:8px;">Post</button>
            <button onclick="closeTiktokUpload()" style="width:100%; background:none; border:none; color:#707579; cursor:pointer; font-size:13.5px; font-weight:600;">Cancel</button>
        </div>
    </div>

    <!-- Main App -->
    <div class="app">
        <section class="sidebar">
            <div id="feedSection">
                <div class="tiktok-feed-container" id="tiktokFeedContainer"></div>
            </div>

            <div id="profileSection" style="display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 24px; text-align: center; background: #fff;">
                <div id="profileAvatar" class="avatar" style="width: 80px; height: 80px; font-size: 32px; background: var(--telegram-blue); margin-bottom: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700;">?</div>
                <h2 id="profileUsername" style="font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);"></h2>
                <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 24px;">Logged in user</p>
                
                <button id="adminPanelBtn" class="admin-btn" style="display: none;" onclick="openAdminModal()">⚙️ Admin Panel</button>
                <button class="logout-btn" onclick="logout()">Log Out</button>
            </div>

            <div class="bottom-nav">
                <div class="nav-item active" id="tabFeedBtn" onclick="switchTab('feed')">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    <span>Home</span>
                </div>
                
                <button class="nav-upload-btn" onclick="openTiktokUpload()">+ Upload</button>

                <div class="nav-item" id="tabProfileBtn" onclick="switchTab('profile')">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Profile</span>
                </div>
            </div>
        </section>
    </div>

    <script>
        const SERVER_URL = "https://a-pmwt.onrender.com"; 
        const socket = io(SERVER_URL);

        let isLoginMode = false;
        let currentLoggedInUser = localStorage.getItem("quo_logged_in_user") || "";
        let globalPosts = [];
        let globalUsers = [];
        let currentAdminTab = 'users';

        function showAlert(message, title = "Notice", icon = "⚠️") {
            document.getElementById("customAlertTitle").textContent = title;
            document.getElementById("customAlertMessage").textContent = message;
            document.getElementById("customAlertIcon").textContent = icon;
            document.getElementById("customAlertModal").style.display = "flex";
        }
        function closeCustomAlert() {
            document.getElementById("customAlertModal").style.display = "none";
        }

        window.onload = function() {
            if (currentLoggedInUser) {
                document.getElementById("authOverlay").style.display = "none";
                socket.emit("join", currentLoggedInUser);
                fetchPosts();
                setupProfileInfo();
            } else {
                document.getElementById("authOverlay").style.display = "flex";
                toggleAuthMode(true);
            }
        };

        function logout() {
            localStorage.removeItem("quo_logged_in_user");
            location.reload();
        }

        function toggleAuthMode(forceLogin = false) {
            isLoginMode = forceLogin ? true : !isLoginMode;
            document.getElementById("authTitle").textContent = isLoginMode ? "QUO - Login" : "QUO - Register";
            document.getElementById("authBtn").textContent = isLoginMode ? "Log In" : "Sign Up";
            document.getElementById("switchAuthText").textContent = isLoginMode ? "Don't have an account? Register" : "Already have an account? Log In";
        }

        async function handleAuth() {
            const username = document.getElementById("authUsername").value.trim().toLowerCase();
            const password = document.getElementById("authPassword").value.trim();

            if (!username || !password) {
                showAlert("Please enter username and password!");
                return;
            }

            const endpoint = isLoginMode ? "/api/login" : "/api/register";
            try {
                const response = await fetch(SERVER_URL + endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    if (isLoginMode) {
                        currentLoggedInUser = data.username;
                        localStorage.setItem("quo_logged_in_user", data.username);
                        document.getElementById("authOverlay").style.display = "none";
                        socket.emit("join", data.username);
                        fetchPosts();
                        setupProfileInfo();
                    } else {
                        showAlert("Registered successfully! Please log in.", "Success", "✅");
                        toggleAuthMode(true);
                    }
                } else {
                    showAlert(data.message || "Authentication failed!");
                }
            } catch (err) {
                showAlert("Cannot connect to server!");
            }
        }

        async function fetchPosts() {
            try {
                const res = await fetch(SERVER_URL + "/api/posts");
                globalPosts = await res.json();
                renderFeedPosts();
            } catch (e) { console.error(e); }
        }

        function setupProfileInfo() {
            if (currentLoggedInUser) {
                document.getElementById("profileUsername").textContent = "@" + currentLoggedInUser;
                document.getElementById("profileAvatar").textContent = currentLoggedInUser.charAt(0).toUpperCase();

                if (currentLoggedInUser === "admin") {
                    document.getElementById("adminPanelBtn").style.display = "block";
                } else {
                    document.getElementById("adminPanelBtn").style.display = "none";
                }
            }
        }

        function switchTab(tab) {
            if (tab === 'profile') stopAllVideos();

            if (tab === 'feed') {
                document.getElementById("feedSection").style.display = "flex";
                document.getElementById("profileSection").style.display = "none";
                document.getElementById("tabFeedBtn").classList.add("active");
                document.getElementById("tabProfileBtn").classList.remove("active");
                fetchPosts();
            } else {
                document.getElementById("feedSection").style.display = "none";
                document.getElementById("profileSection").style.display = "flex";
                document.getElementById("tabProfileBtn").classList.add("active");
                document.getElementById("tabFeedBtn").classList.remove("active");
                setupProfileInfo();
            }
        }

        function openTiktokUpload() { document.getElementById("tiktokUploadModal").style.display = "flex"; }
        function closeTiktokUpload() { document.getElementById("tiktokUploadModal").style.display = "none"; }

        async function openAdminModal() {
            document.getElementById("adminModal").style.display = "flex";
            document.getElementById("adminSearchInput").value = "";
            await loadAdminData();
        }
        function closeAdminModal(e) {
            if (!e || e.target.id === 'adminModal') {
                document.getElementById("adminModal").style.display = "none";
            }
        }

        function switchAdminTab(tab) {
            currentAdminTab = tab;
            document.getElementById("adminTabUsersBtn").classList.toggle("active", tab === 'users');
            document.getElementById("adminTabPostsBtn").classList.toggle("active", tab === 'posts');
            document.getElementById("adminSearchInput").value = "";
            renderAdminList();
        }

        async function loadAdminData() {
            try {
                const resUsers = await fetch(SERVER_URL + "/api/admin/users?adminUser=" + currentLoggedInUser);
                const dataUsers = await resUsers.json();
                if (dataUsers.success) globalUsers = dataUsers.users;

                await fetchPosts();
                renderAdminList();
            } catch (err) {
                console.error(err);
            }
        }

        function renderAdminList() {
            const container = document.getElementById("adminListContainer");
            const keyword = document.getElementById("adminSearchInput").value.trim().toLowerCase();
            container.innerHTML = "";

            if (currentAdminTab === 'users') {
                const filteredUsers = globalUsers.filter(u => u.toLowerCase().includes(keyword));
                if (filteredUsers.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:15px; color:#707579; font-size:13.5px;">No users found</div>`;
                    return;
                }
                filteredUsers.forEach(user => {
                    const item = document.createElement("div");
                    item.className = "admin-item";
                    item.innerHTML = `
                        <span style="font-weight:600; font-size:13.5px;">@${user}</span>
                        ${user !== 'admin' ? `<button class="admin-action-btn" onclick="deleteUser('${user}')">Delete</button>` : `<span style="font-size:12px; color:#10b981; font-weight:600;">Admin</span>`}
                    `;
                    container.appendChild(item);
                });
            } else {
                const filteredPosts = globalPosts.filter(p => (p.text && p.text.toLowerCase().includes(keyword)) || (p.author && p.author.toLowerCase().includes(keyword)));
                if (filteredPosts.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:15px; color:#707579; font-size:13.5px;">No posts found</div>`;
                    return;
                }
                filteredPosts.forEach(post => {
                    const item = document.createElement("div");
                    item.className = "admin-item";
                    
                    let thumbHtml = `<div class="admin-post-thumb" style="display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:11px;">No Media</div>`;
                    if (post.media) {
                        let mediaSrc = post.media;
                        if (mediaSrc.includes('youtube.com/embed/')) {
                            let videoId = mediaSrc.split('embed/')[1]?.split('?')[0];
                            if (videoId) {
                                mediaSrc = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                            }
                        }
                        thumbHtml = `<img src="${mediaSrc}" class="admin-post-thumb" onerror="this.style.display='none'">`;
                    }

                    const snippet = post.text ? (post.text.length > 22 ? post.text.substring(0, 22) + '...' : post.text) : '[Media Post]';
                    const postTime = post.time || 'Recent';

                    item.innerHTML = `
                        <div class="admin-post-info">
                            ${thumbHtml}
                            <div style="overflow:hidden;">
                                <div style="font-size:13px; font-weight:600; color:var(--text-primary);">@${post.author}</div>
                                <div style="font-size:12px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${snippet}</div>
                                <div style="font-size:10.5px; color:#94a3b8;">📅 ${postTime}</div>
                            </div>
                        </div>
                        <button class="admin-action-btn" onclick="deletePost('${post.id || post.timestamp}')">Delete</button>
                    `;
                    container.appendChild(item);
                });
            }
        }

        function filterAdminList() {
            renderAdminList();
        }

        async function deleteUser(usernameToDelete) {
            if (!confirm(`Are you sure you want to delete user @${usernameToDelete}?`)) return;

            try {
                const res = await fetch(SERVER_URL + "/api/admin/user", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ adminUser: currentLoggedInUser, usernameToDelete })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert(`User @${usernameToDelete} deleted!`, "Success", "✅");
                    await loadAdminData();
                    fetchPosts();
                } else {
                    showAlert(data.message || "Failed.");
                }
            } catch (err) { showAlert("Error"); }
        }

        async function deletePost(postId) {
            if (!confirm("Are you sure you want to delete this post?")) return;

            try {
                const res = await fetch(SERVER_URL + `/api/posts/${postId}`, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ adminUser: currentLoggedInUser })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert("Post deleted!", "Success", "✅");
                    await loadAdminData();
                    fetchPosts();
                } else {
                    showAlert(data.message || "Failed.");
                }
            } catch (err) { showAlert("Error"); }
        }

        function parseMediaUrl(url) {
            url = url.trim();
            let result = { type: 'iframe', src: url };
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = "";
                if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
                else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0];
                else if (url.includes('embed/')) videoId = url.split('embed/')[1]?.split('?')[0];
                
                // បន្ថែម controls=0, modestbranding=1 និង disablekb=1 ដើម្បីលាក់ប៊ូតុង YouTube មិនឱ្យចេញមក
                if (videoId) {
                    result.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1&controls=0&modestbranding=1&disablekb=1&rel=0`;
                }
            } else if (url.includes('facebook.com') || url.includes('fb.watch')) {
                result.src = `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&width=500`;
            } else if (url.endsWith('.mp4') || url.endsWith('.webm') || url.endsWith('.mov')) {
                result.type = 'video';
            }
            return result;
        }

        async function createPost() {
            const text = document.getElementById("postTextInput").value.trim();
            const mediaUrl = document.getElementById("postMediaUrlInput").value.trim();
            if (!text && !mediaUrl) return showAlert("Please write something or add media!");

            let parsed = mediaUrl ? parseMediaUrl(mediaUrl) : { type: null, src: null };
            const newPost = {
                author: currentLoggedInUser,
                text,
                media: parsed.src,
                mediaType: parsed.type,
                time: new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }),
                timestamp: Date.now()
            };

            await fetch(SERVER_URL + "/api/posts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newPost)
            });

            document.getElementById("postTextInput").value = "";
            document.getElementById("postMediaUrlInput").value = "";
            closeTiktokUpload();
            fetchPosts();
        }

        function stopAllVideos() {
            document.querySelectorAll('.tiktok-media-wrapper').forEach(w => w.innerHTML = '');
        }

        function renderFeedPosts() {
            const container = document.getElementById("tiktokFeedContainer");
            container.innerHTML = "";

            if (globalPosts.length === 0) {
                container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#fff;"><p>No posts available.</p><button onclick="openTiktokUpload()" style="margin-top:10px; padding:8px 16px; border-radius:12px; background:var(--telegram-blue); color:white; border:none; font-weight:600; cursor:pointer;">+ Upload</button></div>`;
                return;
            }

            globalPosts.forEach((post) => {
                const reel = document.createElement("div");
                reel.className = "tiktok-reel";
                
                // បន្ថែម Layer Cover ខាងលើ និងខាងក្រោមដើម្បីបាំងប៊ូតុង YouTube មិនឱ្យមើលឃើញ
                reel.innerHTML = `
                    <div class="iframe-cover-top"></div>
                    <div class="iframe-cover-bottom"></div>
                    <div class="tiktok-media-wrapper" data-media="${post.media || ''}" data-type="${post.mediaType || 'iframe'}"></div>
                    ${post.text ? `
                    <div class="tiktok-overlay">
                        <div class="tiktok-content-box">
                            <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 2px;">@${post.author}</div>
                            <div class="tiktok-desc">${post.text}</div>
                        </div>
                    </div>` : ''}
                `;
                container.appendChild(reel);
            });

            setupVideoObserver();
        }

        function setupVideoObserver() {
            const container = document.getElementById("tiktokFeedContainer");
            const reels = container.querySelectorAll(".tiktok-reel");
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const wrapper = entry.target.querySelector('.tiktok-media-wrapper');
                    if (!wrapper) return;
                    const mediaUrl = wrapper.getAttribute('data-media');
                    if (entry.isIntersecting) {
                        if (mediaUrl && wrapper.innerHTML === '') {
                            wrapper.innerHTML = `<iframe class="tiktok-media" src="${mediaUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                        }
                    } else {
                        wrapper.innerHTML = '';
                    }
                });
            }, { root: container, threshold: 0.6 });

            reels.forEach(reel => observer.observe(reel));
        }
    </script>
</body>
</html>
