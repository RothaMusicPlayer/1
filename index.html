<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QUO - Social & Chat</title>
    <!-- Socket.io Client Script -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-chat: #f0f2f5;
            --bg-header: #3390ec;
            --text-primary: #1c242b;
            --text-secondary: #879099;
            --bg-hover: #f8fafc;
            --telegram-blue: #3390ec;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            background: var(--bg-main); 
            color: var(--text-primary); 
            height: 100vh; 
            height: 100dvh; 
            width: 100%;
            overflow: hidden; 
            display: flex; 
            position: fixed;
            inset: 0;
        }

        /* Auth Overlay (Login / Register) */
        #authOverlay { position: fixed; inset: 0; background: rgba(15,23,42,0.7); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 28px; width: 100%; max-width: 380px; padding: 32px 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: scaleUp 0.25s ease; }
        .card input { width: 100%; padding: 14px 18px; border-radius: 14px; border: 1.5px solid #e2e8f0; margin-top: 8px; margin-bottom: 14px; outline: none; font-size: 15px; transition: border-color 0.2s; }
        .card input:focus { border-color: var(--telegram-blue); }
        .card button { width: 100%; padding: 14px; border-radius: 14px; background: var(--telegram-blue); color: white; border: none; font-weight: 600; cursor: pointer; font-size: 16px; margin-top: 6px; box-shadow: 0 4px 12px rgba(51,144,236,0.3); }
        .switch-auth { margin-top: 16px; font-size: 13.5px; color: var(--telegram-blue); cursor: pointer; font-weight: 500; }

        /* Custom Modern Alert Modal */
        #customAlertModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3500; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 20px; }
        .custom-alert-card { background: #fff; width: 100%; max-width: 320px; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.25); animation: scaleUp 0.2s ease; }
        @keyframes scaleUp { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .custom-alert-icon { font-size: 40px; margin-bottom: 12px; }
        .custom-alert-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
        .custom-alert-message { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.4; }
        .custom-alert-btn { width: 100%; padding: 12px; border-radius: 14px; background: var(--telegram-blue); color: white; border: none; font-weight: 600; cursor: pointer; font-size: 15px; }

        /* View Single Post Modal */
        #viewPostModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 4000; align-items: center; justify-content: center; backdrop-filter: blur(8px); padding: 16px; }
        .view-post-content { background: #0f172a; width: 100%; max-width: 380px; max-height: 90dvh; border-radius: 28px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.1); }
        .view-post-header { padding: 14px 18px; background: rgba(15,23,42,0.95); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); color: white; }
        .view-post-media-box { background: #000; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; min-height: 320px; cursor: pointer; }
        .view-post-media-box img, .view-post-media-box video, .view-post-media-box iframe { width: 100%; height: 100%; max-height: 450px; object-fit: contain; }

        /* Profile Modal */
        #profileModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 20px; }
        .profile-card { background: #fff; width: 100%; max-width: 400px; max-height: 85dvh; border-radius: 28px; padding: 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden; animation: scaleUp 0.2s ease; }
        .profile-body { overflow-y: auto; flex: 1; margin-top: 10px; padding-right: 4px; }
        .profile-avatar { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; font-weight: bold; background-size: cover; background-position: center; cursor: pointer; position: relative; background-color: var(--telegram-blue); flex-shrink: 0; overflow: hidden; box-shadow: 0 4px 12px rgba(51,144,236,0.3); }

        .my-post-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px; margin-bottom: 12px; text-align: left; position: relative; }
        .my-post-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #64748b; margin-bottom: 8px; }
        .my-post-text { font-size: 14px; color: #1e293b; margin-bottom: 10px; word-break: break-word; line-height: 1.4; }
        .my-post-media { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }

        /* App Layout */
        .app { display: flex; width: 100%; height: 100%; position: relative; overflow: hidden; }
        .sidebar { width: 380px; border-right: 1px solid #e6e6e6; display: flex; flex-direction: column; height: 100%; background: #fff; z-index: 10; position: relative; }

        /* Bottom Navigation Bar */
        .bottom-nav { display: flex; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); border-top: 1px solid #edf2f7; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)) 8px; justify-content: space-around; align-items: center; z-index: 20; box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.04); flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--text-secondary); font-size: 10.5px; font-weight: 600; flex: 1; padding: 4px 2px; border-radius: 12px; }
        .nav-item.active { color: var(--telegram-blue); }
        .nav-item svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .search { padding: 12px 16px; }
        .search input { width: 100%; padding: 10px 16px; border-radius: 22px; border: none; background: #f1f5f9; outline: none; font-size: 14.5px; }
        
        .chat-list { flex: 1; overflow-y: auto; padding: 6px; }
        .chat-item { display: flex; align-items: center; padding: 12px; border-radius: 16px; cursor: pointer; gap: 14px; margin-bottom: 4px; transition: background 0.15s; }
        .chat-item:hover { background: var(--bg-hover); }
        .avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 18px; flex-shrink: 0; background-size: cover; background-position: center; }

        /* TikTok Feed Section */
        #feedSection { display: flex; flex-direction: column; flex: 1; overflow: hidden; background: #000; position: relative; min-height: 0; }
        .tiktok-feed-container { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; height: 100%; position: relative; }
        .tiktok-feed-container::-webkit-scrollbar { display: none; }
        .tiktok-reel { width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        .tiktok-media { width: 100%; height: 100%; object-fit: contain; max-width: 100%; position: absolute; inset: 0; z-index: 1; background: #000; }
        .tiktok-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 10%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.35) 100%); z-index: 3; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 18px; }
        .tiktok-top-bar { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
        .tiktok-create-trigger { background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(12px); color: white; border: 1px solid rgba(255, 255, 255, 0.35); padding: 8px 18px; border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .tiktok-content-box { pointer-events: auto; max-width: 85%; }
        .tiktok-user-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; cursor: pointer; }
        .tiktok-username { color: white; font-weight: 700; font-size: 15.5px; }
        .tiktok-time { color: #cbd5e1; font-size: 12px; }
        .tiktok-desc { color: white; font-size: 14.5px; line-height: 1.45; margin-bottom: 4px; word-break: break-word; }

        /* Upload Modal */
        #tiktokUploadModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 3200; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 20px; }
        .tiktok-upload-card { background: #fff; width: 100%; max-width: 360px; border-radius: 28px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

        /* Chat Window */
        .chat-win { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); height: 100%; position: relative; }
        .chat-win-header { background: var(--bg-header); color: white; padding: 10px 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .chat-header-user { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .back-btn { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; display: none; width: 38px; height: 38px; border-radius: 50%; align-items: center; justify-content: center; }
        .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-container { display: flex; flex-direction: column; max-width: 78%; margin-bottom: 4px; }
        .msg-container.in { align-self: flex-start; }
        .msg-container.out { align-self: flex-end; }
        .msg { padding: 10px 16px; border-radius: 18px; font-size: 15px; line-height: 1.45; word-break: break-word; }
        .msg-container.in .msg { background: #fff; color: #1c242b; }
        .msg-container.out .msg { background: #2b5278; color: #fff; }
        .input-bar { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #e6e6e6; }
        .input-bar input { flex: 1; padding: 12px 18px; border-radius: 24px; border: 1.5px solid #e2e8f0; outline: none; font-size: 15px; }
        .send-btn { background: var(--telegram-blue); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        @media(max-width: 768px) {
            .sidebar { width: 100%; }
            .chat-win { position: fixed; inset: 0; height: 100dvh; transform: translateX(100%); transition: transform 0.25s; z-index: 30; }
            .chat-win.open { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- Auth Overlay -->
    <div id="authOverlay">
        <div class="card" id="authCard">
            <div style="font-size: 44px; margin-bottom: 10px;">💬</div>
            <h2 id="authTitle" style="font-size: 22px; font-weight: 700; color: #1c242b;">QUO - Register</h2>
            <p id="authSubtitle" style="font-size: 13.5px; color: #64748b; margin: 8px 0 20px;">Create a username and password.</p>
            
            <input type="text" id="authUsername" placeholder="Username">
            <input type="password" id="authPassword" placeholder="Password">
            
            <button id="authBtn" onclick="handleAuth()">Sign Up</button>
            <div class="switch-auth" id="switchAuthText" onclick="toggleAuthMode()">Already have an account? Log In</div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal">
        <div class="custom-alert-card">
            <div class="custom-alert-icon" id="customAlertIcon">⚠️</div>
            <h3 class="custom-alert-title" id="customAlertTitle">Notice</h3>
            <p class="custom-alert-message" id="customAlertMessage">Message goes here...</p>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="tiktokUploadModal" onclick="closeTiktokUpload(event)">
        <div class="tiktok-upload-card" onclick="event.stopPropagation()">
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 12px;">Create Reel / Post</h3>
            <textarea id="postTextInput" rows="3" placeholder="What's on your mind?..." style="width:100%; padding:12px 14px; border-radius:14px; border:1.5px solid #e2e8f0; outline:none; resize:none; font-size:14.5px; margin-bottom:12px;"></textarea>
            <input type="text" id="postMediaUrlInput" placeholder="Paste Link (YouTube, Facebook, Image)..." style="width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #e2e8f0; outline: none; font-size: 14px; margin-bottom: 14px;">
            <button onclick="createPost()" style="width:100%; padding:12px; background:var(--telegram-blue); color:white; border:none; border-radius:14px; font-weight:600; cursor:pointer; font-size:15px; margin-bottom:8px;">Post</button>
            <button onclick="closeTiktokUpload()" style="width:100%; background:none; border:none; color:#707579; cursor:pointer; font-size:13.5px; font-weight:600;">Cancel</button>
        </div>
    </div>

    <!-- Main App -->
    <div class="app">
        <section class="sidebar">
            <div id="feedSection">
                <div class="tiktok-feed-container" id="tiktokFeedContainer"></div>
            </div>

            <div id="chatsContainer" style="display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0;">
                <div class="search">
                    <input type="text" id="searchInput" placeholder="Search chats..." oninput="renderChats()">
                </div>
                <div class="chat-list" id="chatList"></div>
            </div>

            <div class="bottom-nav">
                <div class="nav-item active" id="tabFeedBtn" onclick="switchTab('feed')">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    <span>Home</span>
                </div>
                <div class="nav-item" id="tabChatsBtn" onclick="switchTab('chats')">
                    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    <span>Chats</span>
                </div>
            </div>
        </section>

        <!-- Chat Window -->
        <section class="chat-win" id="chatWin">
            <div class="chat-win-header">
                <div class="chat-header-user">
                    <button class="back-btn" onclick="closeChatWin()" id="backBtn">‹</button>
                    <div class="avatar" id="chatHeaderAvatar" style="width:36px; height:36px; font-size:14px;">?</div>
                    <div>
                        <span id="headerName" style="font-size: 15px; font-weight: 600;">Select a chat</span>
                    </div>
                </div>
            </div>
            <div class="messages" id="messagesArea"></div>
            <div class="input-bar" id="chatInputBar">
                <input type="text" id="msgInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </section>
    </div>

    <script>
        // 🔗 ភ្ជាប់ទៅកាន់ Server របស់អ្នក (ឧទាហរណ៍៖ http://localhost:3000 ឬ URL របស់អ្នកដែល Host លើ Cloud)
        const SERVER_URL = "http://localhost:3000"; 
        const socket = io(SERVER_URL);

        let isLoginMode = false;
        let activeChatUser = null;
        let currentLoggedInUser = localStorage.getItem("quo_logged_in_user") || "";
        let globalPosts = [];
        let allUsers = [];

        function showAlert(message, title = "Notice", icon = "⚠️") {
            document.getElementById("customAlertTitle").textContent = title;
            document.getElementById("customAlertMessage").textContent = message;
            document.getElementById("customAlertIcon").textContent = icon;
            document.getElementById("customAlertModal").style.display = "flex";
        }
        function closeCustomAlert() {
            document.getElementById("customAlertModal").style.display = "none";
        }

        window.onload = function() {
            if (currentLoggedInUser) {
                document.getElementById("authOverlay").style.display = "none";
                socket.emit("join", currentLoggedInUser);
                fetchPosts();
                fetchUsers();
            } else {
                document.getElementById("authOverlay").style.display = "flex";
                toggleAuthMode(true);
            }

            // Real-time nhậnសារថ្មី
            socket.on("receive_message", (data) => {
                if (activeChatUser && activeChatUser.toLowerCase() === data.sender.toLowerCase()) {
                    appendMessage(data.text, 'in', data.time);
                }
                fetchChats();
            });
        };

        function toggleAuthMode(forceLogin = false) {
            isLoginMode = forceLogin ? true : !isLoginMode;
            document.getElementById("authTitle").textContent = isLoginMode ? "QUO - Login" : "QUO - Register";
            document.getElementById("authBtn").textContent = isLoginMode ? "Log In" : "Sign Up";
            document.getElementById("switchAuthText").textContent = isLoginMode ? "Don't have an account? Register" : "Already have an account? Log In";
        }

        async function handleAuth() {
            const username = document.getElementById("authUsername").value.trim().toLowerCase();
            const password = document.getElementById("authPassword").value.trim();

            if (!username || !password) {
                showAlert("Please enter username and password!");
                return;
            }

            const endpoint = isLoginMode ? "/api/login" : "/api/register";
            try {
                const response = await fetch(SERVER_URL + endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    if (isLoginMode) {
                        currentLoggedInUser = data.username;
                        localStorage.setItem("quo_logged_in_user", data.username);
                        document.getElementById("authOverlay").style.display = "none";
                        socket.emit("join", data.username);
                        fetchPosts();
                        fetchUsers();
                    } else {
                        showAlert("Registered successfully! Please log in.", "Success", "✅");
                        toggleAuthMode(true);
                    }
                } else {
                    showAlert(data.message || "Authentication failed!");
                }
            } catch (err) {
                showAlert("Cannot connect to server!");
            }
        }

        async function fetchPosts() {
            try {
                const res = await fetch(SERVER_URL + "/api/posts");
                globalPosts = await res.json();
                renderFeedPosts();
            } catch (e) { console.error(e); }
        }

        async function fetchUsers() {
            try {
                const res = await fetch(SERVER_URL + "/api/users");
                allUsers = await res.json();
                renderChats();
            } catch (e) { console.error(e); }
        }

        function switchTab(tab) {
            if (tab === 'feed') {
                document.getElementById("feedSection").style.display = "flex";
                document.getElementById("chatsContainer").style.display = "none";
                document.getElementById("tabFeedBtn").classList.add("active");
                document.getElementById("tabChatsBtn").classList.remove("active");
                fetchPosts();
            } else {
                document.getElementById("feedSection").style.display = "none";
                document.getElementById("chatsContainer").style.display = "flex";
                document.getElementById("tabChatsBtn").classList.add("active");
                document.getElementById("tabFeedBtn").classList.remove("active");
                fetchUsers();
            }
        }

        function openTiktokUpload() {
            document.getElementById("tiktokUploadModal").style.display = "flex";
        }
        function closeTiktokUpload() {
            document.getElementById("tiktokUploadModal").style.display = "none";
        }

        async function createPost() {
            const text = document.getElementById("postTextInput").value.trim();
            const media = document.getElementById("postMediaUrlInput").value.trim();
            if (!text && !media) return showAlert("Please write something or add media!");

            const newPost = {
                author: currentLoggedInUser,
                text,
                media,
                mediaType: media ? 'iframe' : null,
                time: new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }),
                timestamp: Date.now()
            };

            await fetch(SERVER_URL + "/api/posts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newPost)
            });

            document.getElementById("postTextInput").value = "";
            document.getElementById("postMediaUrlInput").value = "";
            closeTiktokUpload();
            fetchPosts();
        }

        function renderFeedPosts() {
            const container = document.getElementById("tiktokFeedContainer");
            container.innerHTML = "";

            if (globalPosts.length === 0) {
                container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#fff;"><p>No posts available.</p><button onclick="openTiktokUpload()" class="tiktok-create-trigger" style="margin-top:10px;">+ Upload</button></div>`;
                return;
            }

            globalPosts.forEach(post => {
                const reel = document.createElement("div");
                reel.className = "tiktok-reel";
                reel.innerHTML = `
                    ${post.media ? `<iframe class="tiktok-media" src="${post.media}" frameborder="0" allowfullscreen></iframe>` : `<div class="tiktok-media" style="background:#111;"></div>`}
                    <div class="tiktok-overlay">
                        <div class="tiktok-top-bar">
                            <span style="color:white; font-weight:700;">QUO Feed</span>
                            <button onclick="openTiktokUpload()" class="tiktok-create-trigger">+ Upload</button>
                        </div>
                        <div class="tiktok-content-box">
                            <div class="tiktok-user-row">
                                <div class="avatar" style="width:38px; height:38px; font-size:14px; background:#3390ec;">${post.author.charAt(0).toUpperCase()}</div>
                                <div>
                                    <div class="tiktok-username">@${post.author}</div>
                                    <div class="tiktok-time">${post.time}</div>
                                </div>
                            </div>
                            ${post.text ? `<div class="tiktok-desc">${post.text}</div>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(reel);
            });
        }

        function renderChats() {
            const list = document.getElementById("chatList");
            list.innerHTML = "";
            const otherUsers = allUsers.filter(u => u.username !== currentLoggedInUser);

            if (otherUsers.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#707579; padding: 25px;">No other users found</div>`;
                return;
            }

            otherUsers.forEach(u => {
                const div = document.createElement("div");
                div.className = "chat-item";
                div.onclick = () => openChat(u.username);
                div.innerHTML = `
                    <div class="avatar" style="background:#3390ec;">${u.username.charAt(0).toUpperCase()}</div>
                    <div style="flex:1;">
                        <div style="font-weight:600; font-size:15px;">${u.username}</div>
                        <div style="font-size:13px; color:#879099;">Tap to chat</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function openChat(username) {
            activeChatUser = username;
            document.getElementById("headerName").textContent = username;
            document.getElementById("chatHeaderAvatar").textContent = username.charAt(0).toUpperCase();
            document.getElementById("chatWin").classList.add("open");
            if (window.innerWidth <= 768) document.getElementById("backBtn").style.display = "flex";
            loadMessages(username);
        }

        function closeChatWin() {
            activeChatUser = null;
            document.getElementById("chatWin").classList.remove("open");
        }

        async function loadMessages(targetUser) {
            const res = await fetch(`${SERVER_URL}/api/messages?user1=${currentLoggedInUser}&user2=${targetUser}`);
            const messages = await res.json();
            const area = document.getElementById("messagesArea");
            area.innerHTML = "";

            messages.forEach(m => {
                appendMessage(m.text, m.sender === currentLoggedInUser ? 'out' : 'in', m.time);
            });
        }

        function appendMessage(text, type, time) {
            const area = document.getElementById("messagesArea");
            const div = document.createElement("div");
            div.className = `msg-container ${type}`;
            div.innerHTML = `<div class="msg">${text}</div><div style="font-size:10px; color:#879099; margin-top:2px; text-align:${type==='out'?'right':'left'}">${time}</div>`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        async function sendMsg() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            const messageData = {
                sender: currentLoggedInUser,
                receiver: activeChatUser,
                text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            };

            socket.emit("send_message", messageData);
            appendMessage(text, 'out', messageData.time);
            input.value = "";
        }
    </script>
</body>
</html>
